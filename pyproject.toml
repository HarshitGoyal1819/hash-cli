[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hash-cli"
version = "0.1.0"
description = "hash-cli — a local-first agentic AI assistant for the terminal, powered by Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langchain>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langgraph>=0.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "ddgs>=9.0.0",
    "pygments>=2.18.0",
    "pathspec>=0.12.1",
    # file-creation tools
    "openpyxl>=3.1.0",
    "reportlab>=4.2.0",
    "PyYAML>=6.0.1",
    # web fetch
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "prompt_toolkit>=3.0.0",
    # premium model providers (OpenAI, DeepSeek, Anthropic, Google)
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
]

[project.scripts]
hash-cli = "hash_cli.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["hash_cli*"]
